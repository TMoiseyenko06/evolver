[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evolver"
version = "0.1.0"
description = "Evolutionary strategy-search for Polymarket 5-minute Bitcoin Up/Down markets"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["polybot", "evolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
